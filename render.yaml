services:
  # Backend Deployment (FastAPI)
  - type: web
    name: zoom-scheduler-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootLink: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TIMEZONE_DEFAULT
        value: Asia/Kolkata
      # These will be filled in the Render Dashboard
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_USER_ID
        sync: false

  # Frontend Deployment (React Static Site)
  - type: web
    name: zoom-scheduler-frontend
    runtime: static
    buildCommand: npm install && npm run build
    publishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: zoom-scheduler-backend
          property: host
